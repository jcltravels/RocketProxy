<!--
  Rocket Proxy import button — minimal copy-paste form.

  Replace the two data- attributes with your panel's template variables and
  paste this wherever your subscription URL is already shown.

  Nothing else is required: no CSS framework, no jQuery, no build step.
-->

<a class="rocket-proxy-button"
   data-rocket-proxy
   data-url="https://panel.example.com/sub/USER_TOKEN"
   data-name="Example Net">

  </svg>
  Open in Rocket Proxy
</a>

<script src="/static/rocket-proxy-button.js"></script>

<style>
.rocket-proxy-button {
  display: inline-flex;
  align-items: center;
  gap: .5em;
  padding: .6em 1.1em;
  border-radius: 8px;
  background: #0d7f8a;
  color: #fff;
  font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
