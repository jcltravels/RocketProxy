name: Feature request
description: Suggest an idea for Rocket Proxy
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us the underlying need, not only the proposed solution — it often leads to a better answer.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which platforms?
      multiple: true
      options: [iPhone, iPad, Mac, Apple TV]
